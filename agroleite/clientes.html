<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/estilo.css">
    <title>AGROLEITE - Cadastro de Clientes</title>
</head>

<body>

    <nav>
        <a href="home.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta Agendamentos</a>
        <a href="../index.html">Sair</a>
    </nav>

    <header class="banner">
        <h1>Gestão de Clientes</h1>
        <p>Cadastre produtores, cooperativas e clientes do sistema AGROLEITE</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Novo Cadastro de Cliente</h2>

            <label>Nome Completo</label>
            <input type="text" id="nome">

            <label>CPF</label>
            <input type="text" id="cpf">

            <label>Telefone</label>
            <input type="text" id="telefone">

            <label>E-mail</label>
            <input type="email" id="email">

            <button onclick="salvarCliente()">Salvar Cliente</button>
        </div>

        <div class="card">
            <h2>Clientes Cadastrados</h2>
            <div id="lista-clientes"></div>
        </div>

    </div>

    <script>
        function salvarCliente() {
            const nome = document.getElementById("nome").value;
            const cpf = document.getElementById("cpf").value;
            const telefone = document.getElementById("telefone").value;

            fetch("/salvar-cliente", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `nome=${encodeURIComponent(nome)}&cpf=${encodeURIComponent(cpf)}&telefone=${encodeURIComponent(telefone)}`
            })
            .then(() => {
                alert("Cliente salvo!");
                listarClientes();
            })
            .catch(err => alert("Erro ao salvar: " + err));
        }

        function listarClientes() {
            fetch("/listar-clientes")
                .then(r => r.json())
                .then(dados => {
                    const div = document.getElementById("lista-clientes");
                    div.innerHTML = "<ul>" + dados.map(c => `<li>${c.nome} - ${c.cpf} - ${c.telefone}</li>`).join("") + "</ul>";
                })
                .catch(err => console.error("Erro ao listar clientes:", err));
        }

        listarClientes();
    </script>

</body>
</html>
